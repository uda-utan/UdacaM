<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UdacaM | 映像制作</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', Arial, sans-serif;
      background: #f8f5e7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      text-align: center;
      background: #fff;
      padding: 60px 40px;
      border-radius: 10px;
      box-shadow: 0 4px 16px #bbb;
      max-width: 600px;
    }

    h1 {
      font-size: 2.5rem;
      font-family: 'Playfair Display', 'Montserrat', Arial, sans-serif;
      font-style: italic;
      color: #388e3c;
      margin-bottom: 30px;
    }

    p {
      font-size: 1.3rem;
      color: #333;
      line-height: 1.8;
      margin-bottom: 40px;
    }

    a {
      display: inline-block;
      padding: 12px 32px;
      background: #388e3c;
      color: white;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 6px;
      transition: all 0.3s ease;
    }

    a:hover {
      background: #43a047;
      transform: scale(1.05);
    }

    @media (max-width: 480px) {
      .container {
        padding: 40px 20px;
      }

      h1 {
        font-size: 1.8rem;
      }

      p {
        font-size: 1rem;
      }

      a {
        padding: 10px 24px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>UdacaM</h1>
    <p>HPを移行しました！<br>こちらからどうぞ→</p>
    <a href="https://www.andiinc.net">新しいホームページへ</a>
  </div>
</body>
</html>
