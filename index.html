<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UdacaM | 映像制作</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', Arial, sans-serif;
      background: #f8f5e7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      text-align: center;
      background: #fff;
      padding: 60px 40px;
      border-radius: 10px;
      box-shadow: 0 4px 16px #bbb;
      max-width: 600px;
    }

    h1 {
      font-size: 2.5rem;
      font-family: 'Playfair Display', 'Montserrat', Arial, sans-serif;
      font-style: italic;
      color: #388e3c;
      margin-bottom: 30px;
    }

    p {
      font-size: 1.3rem;
      color: #333;
      line-height: 1.8;
      margin-bottom: 40px;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }

    .main-button-group {
      width: 100%;
      margin-bottom: 20px;
    }

    .sub-buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    a {
      display: inline-block;
      padding: 12px 32px;
      background: #388e3c;
      color: white;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 6px;
      transition: all 0.3s ease;
    }

    a:hover {
      background: #43a047;
      transform: scale(1.05);
    }

    .sub-button {
      background: #1565c0;
      padding: 10px 20px;
      font-size: 1rem;
    }

    .sub-button:hover {
      background: #1e88e5;
    }

    @media (max-width: 480px) {
      .container {
        padding: 40px 20px;
      }

      h1 {
        font-size: 1.8rem;
      }

      p {
        font-size: 1rem;
      }

      a {
        padding: 10px 24px;
        font-size: 1rem;
      }

      .sub-buttons {
        flex-direction: column;
      }

      .sub-button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>UdacaM</h1>
    <p>HPを移行しました！<br>こちらからどうぞ→</p>
    <div class="button-group">
      <div class="main-button-group">
        <a href="https://www.andiinc.net">新しいホームページへ</a>
      </div>
      <div class="sub-buttons">
        <a href="works.html" class="sub-button">実績</a>
        <a href="profile.html" class="sub-button">プロフィール</a>
      </div>
    </div>
  </div>
</body>
</html>
